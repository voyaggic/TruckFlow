[package]
name = "truckflow"
version = "0.1.1"
description = "TruckFlow — gate trip management"
authors = ["TruckFlow"]
edition = "2021"

[lib]
name = "truckflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
hostname = "0.4"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
postgres = "0.19.14"
rand = "0.10.2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.97.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[features]
default = ["dev-data"]
dev-data = []  # Include test seed data (vehicles, companies, drivers, test users)

[dev-dependencies]
native-tls = "0.2"
postgres-native-tls = "0.5"
postgres = "0.19.14"
serde_json = "1.0.151"
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = "s"        # optimize for binary size
lto = true             # link-time optimization
codegen-units = 1      # single codegen unit for max optimization
strip = true           # strip debug symbols
panic = "abort"        # smaller binary, no unwinding
