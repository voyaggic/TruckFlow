name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync ANPR source files
        run: node sync-anpr.mjs

      - name: Build & sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis,msi -- --no-default-features

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read signature
        id: sig
        shell: bash
        run: |
          SIG_FILE=$(find src-tauri/target/release/bundle/nsis -name '*.sig' | head -1)
          echo "CONTENT<<EOF" >> "$GITHUB_OUTPUT"
          cat "$SIG_FILE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TruckFlow ${{ steps.version.outputs.VERSION }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SIG="${{ steps.sig.outputs.CONTENT }}"
          INSTALLER_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${VERSION}/TruckFlow_${VERSION}_x64-setup.exe"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p docs
          cat > docs/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "TruckFlow v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "${INSTALLER_URL}"
              }
            }
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
